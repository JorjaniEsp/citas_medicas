services:
# comentario
  db:
    image: mysql:9.7
    container_name: base_datos
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_DATABASE: citas_medicas
    ports:
      - 3307:3306
    volumes:
      - ./db_dump:/docker-entrypoint-initdb.d
      - ./mysql:/var/lib/mysql
    secrets:
      - db_password

  webdatos:
    container_name: web_datos
    volumes:
      - ./Data/public:/var/www/html/public
      - ./Data/src:/var/www/html/src
      # - ./Data/vendor:/var/www/html/vendor
    #   command: bash -c "composer install && apache2-foreground"
    build:
      context: .
      dockerfile: ./Data/Dockerfile
    ports:
      - 8080:80
    depends_on:
      - db

  webnegocios:
    container_name: web_negocios
    volumes:
      - ./Business/public:/var/www/html/public
      - ./Business/src:/var/www/html/src
      #- ./Business/vendor:/var/www/html/vendor

    #command: bash -c "composer install && apache2-foreground"
    build:
      context: .
      dockerfile: ./Business/Dockerfile
    ports:
      - 9090:80
    depends_on:
      - webdatos

  webpresentacion:
    container_name: web_presentacion
    build: 
      context: ./citas_medicas
      dockerfile: Dockerfile
    ports:
      - 4200:80
secrets:
  db_password:
    file: ./db_password.txt